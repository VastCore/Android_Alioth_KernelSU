name: Build Alioth4 (Release)
on: [workflow_dispatch]

jobs:
  build:
    name: Build Alioth4 (Release)
    runs-on: ubuntu-24.04
    steps:

      - name: Set Beijing timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Shanghai"

      - name: Set SWAP to 5GiB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 5

      - name: Initialize Compilation Environment
        run: |
          sudo apt-get update
          sudo apt-get install git automake build-essential bc wget tar zstd -y
          
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: hyper-2
          fetch-depth: 1

      - name: Get Toolchain (Neutron Clang19.0.0 + Python2)
        run: |
          mkdir -p toolchain/llvm
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar --zstd -xf neutron-clang-10032024.tar.zst -C toolchain/llvm --strip-components=1
          git clone https://github.com/VastCore/alioth-python-2.7.18-prebuilt.git --depth=1 toolchain/python2
          rm -rf neutron-clang-10032024.tar.zst

      - name: Processing submodules
        run: |
          git submodule update --init --recursive android/Installer
          git submodule update --init --recursive Baseband-guard
          git submodule update --init --recursive KernelSU
          cd KernelSU
          git fetch --tags
          LATEST_TAG=$(git tag -l | sort -V | tail -n1)
          echo "Latest KernelSU tag: $LATEST_TAG"
          git checkout $LATEST_TAG

      - name: Integrate KernelSU into build system
        run: |
          echo "=== Remove symlink, copy real directory instead ==="
          rm -f drivers/kernelsu
          cp -ra KernelSU/kernel drivers/kernelsu
          echo "=== Verify integration ==="
          test -f drivers/kernelsu/Kconfig && echo "Kconfig: OK"
          test -f drivers/kernelsu/Makefile && echo "Makefile: OK"
          grep -q 'source.*kernelsu/Kconfig' drivers/Kconfig && echo "Kconfig ref: OK"
          grep -q 'obj.*kernelsu/' drivers/Makefile && echo "Makefile ref: OK"
          ls drivers/kernelsu/

      - name: Add KSU configs
        run: |
          sed -i -e '$a\'$'\n''CONFIG_KSU=y\nCONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y' arch/arm64/configs/alioth_kosminor_defconfig
          echo "=== KSU configs appended ==="
          tail -5 arch/arm64/configs/alioth_kosminor_defconfig

      - name: Force custom compiler banner string
        run: |
          CUSTOM_COMPILER_STR="clang version 10.0.7 for Android NDK, GNU ld (binutils-2.27-bd24d23f) 2.27.0.20170315"
          sed -i "/CC_VERSION=/c\CC_VERSION=\"${CUSTOM_COMPILER_STR}\"" scripts/mkcompile_h
          sed -i '/^if \$CC -v/,/fi/d' scripts/mkcompile_h
          sed -i '/^LD_VERSION=/c\LD_VERSION=""' scripts/mkcompile_h
          sed -i '/^if \$LD -v/,/fi/d' scripts/mkcompile_h
          sed -i '/ld.lld/,+5d' scripts/mkcompile_h
          sed -i '/COMPILER=/c\COMPILER="$CC_VERSION"' scripts/mkcompile_h
          sed -i '/LINUX_COMPILER=/c\LINUX_COMPILER=\"$CC_VERSION\"' scripts/mkcompile_h
          cat scripts/mkcompile_h | grep -E "CC_VERSION|LD_VERSION|COMPILER|LINUX_COMPILER"

      - name: Build Kernel
        run: |
          export LOCALVERSION="-g92c089fc2d37"
          export KBUILD_BUILD_HOST=pangu-build-component-vendor-727090-8pdx4-w2b4x-lb74b
          export KBUILD_BUILD_USER=builder
          export ARCH="arm64"
          export SUBARCH="arm64"
          export PATH="$GITHUB_WORKSPACE/toolchain/llvm/bin:$GITHUB_WORKSPACE/toolchain/python2/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/llvm/lib64:$GITHUB_WORKSPACE/toolchain/python2/lib:$LD_LIBRARY_PATH"

          # 伪造ld.lld，拦截--version，防止抓取LLD版本号
          mkdir -p $GITHUB_WORKSPACE/fakebin
          cat > $GITHUB_WORKSPACE/fakebin/ld.lld << 'SHELL'
          #!/bin/sh
          for arg in "$@"; do
          if [ "$arg" = "--version" ]; then
          exit 0
          fi
          done
          exec $(which ld.lld) "$@"
          SHELL
          chmod +x $GITHUB_WORKSPACE/fakebin/ld.lld
          export PATH="$GITHUB_WORKSPACE/fakebin:$PATH"

          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-android-"
          make O=out alioth_kosminor_defconfig
          echo "=== CONFIG_KSU in .config ==="
          grep CONFIG_KSU out/.config || echo "WARNING: CONFIG_KSU NOT in .config!"
          make -j$(nproc --all) O=out 2>&1

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alioth_Kernel_Ksu
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
            out/arch/arm64/boot/dtbo.img
