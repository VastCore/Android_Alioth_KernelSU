name: Build Alioth
# 限制并发，同设备只跑一次构建
concurrency:
  group: alioth-kernel-release
  cancel-in-progress: true
on: [workflow_dispatch]

jobs:
  build:
    name: Build Alioth (Release)
    runs-on: ubuntu-24.04
    steps:
      - name: Set Beijing timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Shanghai"

      - name: Set SWAP to 5GiB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install git automake build-essential bc libssl-dev libelf-dev flex bison zip unzip cpio -y

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: hyper-2
          fetch-depth: 1

      # 缓存工具链，大幅提速重复构建
      - name: Cache Toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: ${{ github.workflow }}-toolchain-llvm-py2

      - name: Get Toolchain if missing
        run: |
          [ ! -d toolchain/llvm ] && git clone https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone.git --depth 1 toolchain/llvm
          [ ! -d toolchain/python2 ] && git clone https://github.com/VastCore/alioth-python-2.7.18-prebuilt.git --depth=1 toolchain/python2

      - name: Update submodules
        run: |
          git submodule update --init --recursive android/Installer Baseband-guard KernelSU

      - name: Switch KernelSU to latest tag
        run: |
          cd KernelSU
          git fetch --tags --depth 1
          TAGS=$(git tag -l)
          if [ -z "$TAGS" ]; then
            echo "ERROR: No KernelSU tags found!"
            exit 1
          fi
          LATEST_TAG=$(echo "$TAGS" | sort -V | tail -n1)
          echo "Latest KernelSU tag: $LATEST_TAG"
          git checkout $LATEST_TAG

      - name: Integrate KernelSU into drivers
        run: |
          rm -rf drivers/kernelsu
          cp -ra KernelSU/kernel drivers/kernelsu
          # 校验失败直接退出
          test -f drivers/kernelsu/Kconfig || exit 1
          test -f drivers/kernelsu/Makefile || exit 1
          grep -q 'source.*kernelsu/Kconfig' drivers/Kconfig || exit 1
          grep -q 'obj.*kernelsu/' drivers/Makefile || exit 1
          echo "KernelSU integrated successfully"

      - name: Inject KSU config (avoid duplicate lines)
        run: |
          DEF=arch/arm64/configs/alioth_kosminor_defconfig
          grep -q '^CONFIG_KSU=y' $DEF || echo 'CONFIG_KSU=y' >> $DEF
          grep -q '^CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y' $DEF || echo 'CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y' >> $DEF
          tail -5 $DEF

      - name: Build Kernel
        run: |
          export LOCALVERSION="-g92c089fc2d37"
          export KBUILD_BUILD_HOST=AICloudServer
          export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
          export ARCH="arm64"
          export SUBARCH="arm64"
          export PATH="$GITHUB_WORKSPACE/toolchain/llvm/bin:$GITHUB_WORKSPACE/toolchain/python2/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/llvm/lib64:$GITHUB_WORKSPACE/toolchain/python2/lib:$LD_LIBRARY_PATH"

          export KBUILD_COMPILER_STRING=$(clang --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//')
          export KBUILD_LINKER_STRING=$(ld.lld --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//' | sed 's/(compatible with [^)]*)//')

          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-android-"

          make O=out alioth_kosminor_defconfig
          # 必须存在CONFIG_KSU，否则终止编译
          grep -q '^CONFIG_KSU=y' out/.config || { echo "FATAL: CONFIG_KSU not enabled!"; exit 1; }
          # 限制线程数，避免资源耗尽
          JOBS=$(($(nproc)/2))
          echo "Using $JOBS threads for compilation"
          make -j$JOBS O=out 2>&1 || { echo "Kernel build failed!"; exit 1; }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alioth_Kernel_Ksu
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
            out/arch/arm64/boot/dtbo.img
            out/vmlinux
            out/System.map
