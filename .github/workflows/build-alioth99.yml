name: Build Alioth99 (Release)
on: [workflow_dispatch]

jobs:
  build:
    name: Build Alioth99 (Release)
    runs-on: ubuntu-24.04
    steps:

      - name: Set Beijing timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Shanghai"

      - name: Set SWAP to 5GiB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 5

      - name: Initialize Compilation Environment
        run: |
          sudo apt-get update
          sudo apt-get install git automake build-essential bc libelf-dev bison flex zip unzip -y
          
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: hyper-2
          fetch-depth: 1

      - name: Get Toolchain
        run: |
          git clone https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone.git --depth 1 toolchain/llvm
          git clone https://github.com/VastCore/alioth-python-2.7.18-prebuilt.git --depth=1 toolchain/python2

      - name: Processing submodules
        run: |
          git submodule update --init --recursive android/Installer
          git submodule update --init --recursive Baseband-guard
          git submodule update --init --recursive KernelSU
          cd KernelSU
          git fetch --tags
          LATEST_TAG=$(git tag -l | sort -V | tail -n1)
          echo "Latest KernelSU tag: $LATEST_TAG"
          git checkout $LATEST_TAG

      - name: Integrate KernelSU into build system
        run: |
          echo "=== Remove symlink, copy real directory instead ==="
          rm -f drivers/kernelsu
          cp -ra KernelSU/kernel drivers/kernelsu
          echo "=== Verify integration ==="
          test -f drivers/kernelsu/Kconfig && echo "Kconfig: OK"
          test -f drivers/kernelsu/Makefile && echo "Makefile: OK"
          grep -q 'source.*kernelsu/Kconfig' drivers/Kconfig && echo "Kconfig ref: OK"
          grep -q 'obj.*kernelsu/' drivers/Makefile && echo "Makefile ref: OK"
          ls drivers/kernelsu/

      - name: Add KSU configs + LKM 模块必备配置
        run: |
          # 内置KSU开关
          echo "CONFIG_KSU=y" >> arch/arm64/configs/alioth_kosminor_defconfig
          echo "CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y" >> arch/arm64/configs/alioth_kosminor_defconfig
          # LKM模块全套依赖
          echo "CONFIG_MODULES=y" >> arch/arm64/configs/alioth_kosminor_defconfig
          echo "CONFIG_MODULE_UNLOAD=y" >> arch/arm64/configs/alioth_kosminor_defconfig
          echo "CONFIG_MODULE_FORCE_LOAD=y" >> arch/arm64/configs/alioth_kosminor_defconfig
          echo "CONFIG_MODVERSIONS=y" >> arch/arm64/configs/alioth_kosminor_defconfig
          echo "CONFIG_MODULE_SRCVERSION_ALL=y" >> arch/arm64/configs/alioth_kosminor_defconfig
          echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/alioth_kosminor_defconfig
          echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/alioth_kosminor_defconfig
          echo "CONFIG_KALLSYMS_ABSOLUTE_PERCPU=y" >> arch/arm64/configs/alioth_kosminor_defconfig
          echo "CONFIG_KALLSYMS_BASE_RELATIVE=y" >> arch/arm64/configs/alioth_kosminor_defconfig
          echo "CONFIG_MODULE_SIG=n" >> arch/arm64/configs/alioth_kosminor_defconfig
          echo "CONFIG_MODULE_SIG_ALL=n" >> arch/arm64/configs/alioth_kosminor_defconfig
          echo "CONFIG_MODULE_SIG_FORCE=n" >> arch/arm64/configs/alioth_kosminor_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/alioth_kosminor_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> arch/arm64/configs/alioth_kosminor_defconfig
          echo "=== KSU & LKM configs appended ==="
          tail -15 arch/arm64/configs/alioth_kosminor_defconfig


      - name: Build Kernel Image
        run: |
          export LOCALVERSION="-g92c089fc2d37"
          export KBUILD_BUILD_HOST=AICloudServer
          export KBUILD_BUILD_USER=VastCore
          export ARCH="arm64"
          export SUBARCH="arm64"
          export PATH="$GITHUB_WORKSPACE/toolchain/llvm/bin:$GITHUB_WORKSPACE/toolchain/python2/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/llvm/lib64:$GITHUB_WORKSPACE/toolchain/python2/lib:$LD_LIBRARY_PATH"
          export KBUILD_COMPILER_STRING=$(clang --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//')
          export KBUILD_LINKER_STRING=$(ld.lld --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//' | sed 's/(compatible with [^)]*)//')
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-android-"
          make O=out alioth_kosminor_defconfig
          echo "=== CONFIG_KSU / MODULES check ==="
          grep -E 'CONFIG_KSU|CONFIG_MODULES|CONFIG_KALLSYMS_ALL' out/.config
          make -j$(nproc --all) O=out 2>&1

      # 【新增步骤：编译内核模块，生成ksu.ko】
      - name: Build KernelSU LKM ksu.ko Module
        run: |
          export LOCALVERSION="-g92c089fc2d37"
          export KBUILD_BUILD_HOST=AICloudServer
          export KBUILD_BUILD_USER=VastCore
          export ARCH="arm64"
          export SUBARCH="arm64"
          export PATH="$GITHUB_WORKSPACE/toolchain/llvm/bin:$GITHUB_WORKSPACE/toolchain/python2/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/llvm/lib64:$GITHUB_WORKSPACE/toolchain/python2/lib:$LD_LIBRARY_PATH"
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-android-"
          # 编译全部内核模块
          make -j$(nproc --all) O=out modules
          # 复制ksu.ko到根目录方便上传
          find out -name "ksu.ko" -exec cp {} ./ksu.ko \;
          ls -lh ./ksu.ko

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alioth_Kernel_Ksu
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
            out/arch/arm64/boot/dtbo.img
            ./ksu.ko
