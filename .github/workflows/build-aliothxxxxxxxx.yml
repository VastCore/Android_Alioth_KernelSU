name: Build Aliothxxxxxxxx (Release)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release Tag Name (e.g., v1.0.0)
        required: true
        default: v${{ github.sha }}
      release_title:
        description: Release Title
        default: Alioth KernelSU Release Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 发布Release必须开启写入权限
  actions: read

jobs:
  build:
    name: Build Aliothxxxxxxxx (Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Set Beijing timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Shanghai"

      - name: Set SWAP to 5GiB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 5

      - name: Initialize Compilation Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install git automake build-essential bc zip coreutils -y -qq

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: HyperOS
          fetch-depth: 1

      - name: Get Toolchain
        run: |
          git clone https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone.git --depth 1 toolchain/llvm
          git clone https://github.com/VastCore/Alioth-Python-2.7.18-Mod.git --depth 1 toolchain/python2

      - name: Processing submodules
        run: |
          git submodule update --init --remote --rebase --recursive android/Installer
          git submodule update --init --remote --rebase --recursive Baseband-guard
          git submodule update --init --remote --rebase --recursive KernelSU
          cd KernelSU
          git fetch --tags
          LATEST_TAG=$(git tag -l | sort -V | tail -n1)
          echo "KERNELSU_VERSION=$LATEST_TAG" >> $GITHUB_ENV
          git checkout $LATEST_TAG

      - name: Integrate KernelSU into build system
        run: |
          rm -f drivers/kernelsu
          cp -ra KernelSU/kernel drivers/kernelsu
          test -f drivers/kernelsu/Kconfig && echo "Kconfig: OK"
          test -f drivers/kernelsu/Makefile && echo "Makefile: OK"

      - name: Add KSU configs
        run: |
          echo -e "\nCONFIG_KSU=y\nCONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y" >> arch/arm64/configs/alioth_perf_defconfig

      - name: Build Kernel
        run: |
          export LOCALVERSION="-g92c089fc2d37"
          export KBUILD_BUILD_HOST=pangu-build-component-vendor-727090-8pdx4-w2b4x-lb74b
          export KBUILD_BUILD_USER=builder
          export ARCH="arm64"
          export SUBARCH="arm64"
          export PATH="$GITHUB_WORKSPACE/toolchain/llvm/bin:$GITHUB_WORKSPACE/toolchain/python2/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/llvm/lib64:$GITHUB_WORKSPACE/toolchain/python2/lib:$LD_LIBRARY_PATH"
          export KBUILD_COMPILER_STRING=$(clang --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//')
          export KBUILD_LINKER_STRING=$(ld.lld --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//' | sed 's/(compatible with [^)]*)//')
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-android-"
          make O=out alioth_perf_defconfig
          grep CONFIG_KSU out/.config || echo "WARNING: CONFIG_KSU NOT in .config!"
          make -j$(nproc --all) O=out 2>&1 | tee build.log

      # ========== 新增：制品打包 + MD5校验 ==========
      - name: Package kernel files & generate MD5 checksum
        run: |
          mkdir -p output
          # 打包内核全部产物
          cd out/arch/arm64/boot
          zip -r $GITHUB_WORKSPACE/output/Alioth_KernelSU_${{ env.KERNELSU_VERSION }}.zip Image dtbo.img dts/vendor/qcom/*.dtb
          cd $GITHUB_WORKSPACE/output
          # 生成MD5校验文件
          md5sum *.zip > checksum.md5
          cat checksum.md5
        shell: bash

      # 上传原始文件+压缩包+校验文件+编译日志
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Alioth_KernelSU_Build_Artifacts
          path: |
            output/
            build.log
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
            out/arch/arm64/boot/dtbo.img
          retention-days: 60

      # ========== 新增：构建成功自动发布GitHub Release ==========
      - name: Create GitHub Release
        if: success() # 仅编译成功时执行
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_title }} | KernelSU:${{ env.KERNELSU_VERSION }}
          body: |
            ## Build Info
            - Device: Alioth
            - KernelSU Version: `${{ env.KERNELSU_VERSION }}`
            - Build Time: `${{ github.run_started_at }}`
            - Commit SHA: `${{ github.sha }}`
            ## Checksum
            ```
            $(cat output/checksum.md5)
            ```
          files: |
            output/*.zip
            output/checksum.md5
          draft: false
          prerelease: false
          append_body: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
