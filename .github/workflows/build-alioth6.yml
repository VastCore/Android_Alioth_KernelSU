name: Build Alioth6 (Release)
on:
  workflow_dispatch:
    inputs:
      bbg_ref:
        description: "Baseband-guard git ref (branch/tag/sha)"
        required: true
        default: "main"
        type: string

jobs:
  build:
    name: Build Alioth6 (Release + KernelSU + Baseband-guard)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      WORK_DIR: ${{ github.workspace }}/work
      BBG_REF: ${{ github.event.inputs.bbg_ref || 'main' }}
      LOCALVERSION_OVERRIDE: -alioth-bbg-ksu
      KBUILD_BUILD_USER: VastCore-BBG-CI
      KBUILD_BUILD_HOST: GitHub-Actions-Alioth
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Set Beijing timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Shanghai"

      - name: Set SWAP to 5GiB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 5

      - name: Free disk space
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h

      - name: Initialize Compilation Environment
        run: |
          sudo apt-get update
          sudo apt-get install git automake build-essential bc bison flex libssl-dev libelf-dev dwarves rsync cpio unzip zip zstd tar device-tree-compiler gawk openssl ccache -y

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: hyper-2
          fetch-depth: 1

      - name: Get Toolchain
        run: |
          git clone https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone.git --depth 1 toolchain/llvm
          git clone https://github.com/VastCore/alioth-python-2.7.18-prebuilt.git --depth=1 toolchain/python2

      - name: Processing submodules (KernelSU + Baseband-guard + Installer)
        run: |
          set -eux
          git submodule update --init --recursive android/Installer
          git submodule update --init --recursive Baseband-guard
          git submodule update --init --recursive KernelSU

          # Checkout specified BBG ref
          cd Baseband-guard
          git fetch origin ${{ env.BBG_REF }}
          git checkout ${{ env.BBG_REF }}
          echo "Baseband-guard checked out to ref: ${{ env.BBG_REF }}"
          cd ..

          # Update KernelSU to latest tag
          cd KernelSU
          git fetch --tags
          LATEST_TAG=$(git tag -l | sort -V | tail -n1)
          echo "Latest KernelSU tag: $LATEST_TAG"
          git checkout $LATEST_TAG
          cd ..

      - name: Integrate KernelSU into build system
        run: |
          echo "=== Remove symlink, copy real directory instead ==="
          rm -f drivers/kernelsu
          cp -ra KernelSU/kernel drivers/kernelsu
          echo "=== Verify KSU integration ==="
          test -f drivers/kernelsu/Kconfig && echo "KSU Kconfig: OK"
          test -f drivers/kernelsu/Makefile && echo "KSU Makefile: OK"
          grep -q 'source.*kernelsu/Kconfig' drivers/Kconfig && echo "KSU Kconfig ref: OK"
          grep -q 'obj.*kernelsu/' drivers/Makefile && echo "KSU Makefile ref: OK"

      - name: Integrate Baseband-guard into kernel security subsystem
        run: |
          set -eux
          # Create symlink security/baseband-guard -> root Baseband-guard folder
          rm -rf security/baseband-guard
          ln -sf ../../Baseband-guard security/baseband-guard

          # Inject BBG wiring to security/Kconfig
          if ! grep -q "source security/baseband-guard/Kconfig" security/Kconfig; then
            echo 'source "security/baseband-guard/Kconfig"' >> security/Kconfig
          fi

          # Inject BBG module compile entry to security/Makefile
          if ! grep -q "obj-\$(CONFIG_BBG)" security/Makefile; then
            echo 'obj-$(CONFIG_BBG) += baseband-guard/' >> security/Makefile
          fi

          echo "=== BBG security layer wiring complete ==="
          ls -la security/baseband-guard/

      - name: Inject BBG + KSU configs to defconfig
        run: |
          set -eux
          DEFCONFIG=arch/arm64/configs/alioth_kosminor_defconfig
          # KernelSU config
          sed -i -e '$a\'$'\n''CONFIG_KSU=y\nCONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y' $DEFCONFIG

          # Baseband-guard core config fragment
          cat >> $DEFCONFIG << EOF
# Baseband-guard LSM
CONFIG_BBG=y
CONFIG_SECURITY_BASEBAND_GUARD=y
CONFIG_LSM="baseband_guard,default"
EOF

          echo "=== Final defconfig tail ==="
          tail -10 $DEFCONFIG

      - name: Build Kernel with BBG + KSU
        run: |
          set -eux
          set -o pipefail
          mkdir -p ${{ env.WORK_DIR }}
          export LOCALVERSION="${{ env.LOCALVERSION_OVERRIDE }}"
          export KBUILD_BUILD_HOST=${{ env.KBUILD_BUILD_HOST }}
          export KBUILD_BUILD_USER=${{ env.KBUILD_BUILD_USER }}
          export ARCH="arm64"
          export SUBARCH="arm64"
          export PATH="$GITHUB_WORKSPACE/toolchain/llvm/bin:$GITHUB_WORKSPACE/toolchain/python2/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/llvm/lib64:$GITHUB_WORKSPACE/toolchain/python2/lib:$LD_LIBRARY_PATH"
          export KBUILD_COMPILER_STRING=$(clang --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//')
          export KBUILD_LINKER_STRING=$(ld.lld --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//' | sed 's/(compatible with [^)]*)//')
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-android-"

          make O=out alioth_kosminor_defconfig
          echo "=== Check BBG & KSU config status ==="
          grep -E 'CONFIG_BBG|CONFIG_KSU|CONFIG_LSM' out/.config
          make -j$(nproc --all) O=out 2>&1 | tee ${{ env.WORK_DIR }}/build.log

      - name: Verify BBG & Kernel build artifacts
        run: |
          set -eux
          echo "==== Build Info ===="
          echo "Kernel branch: hyper-2"
          echo "Baseband-guard ref: ${{ env.BBG_REF }}"
          echo "LOCALVERSION: ${{ env.LOCALVERSION_OVERRIDE }}"

          echo "==== BBG Security Config Check ===="
          grep -E 'CONFIG_BBG|CONFIG_LSM|CONFIG_SECURITY=' out/.config

          echo "==== Kernel Image Exists ===="
          test -f out/arch/arm64/boot/Image && echo "Image OK"
          ls -lh out/arch/arm64/boot/

      - name: Generate BBG integration patch bundle
        if: always()
        run: |
          set -eux
          mkdir -p ${{ env.WORK_DIR }}/dist/patches
          mkdir -p ${{ env.WORK_DIR }}/dist/meta

          # Record BBG integration changes
          {
            echo "# Baseband-guard Integration File List"
            echo "Baseband-guard/  (submodule source)"
            echo "security/baseband-guard -> ../../Baseband-guard (symlink)"
            echo "security/Kconfig (added BBG source line)"
            echo "security/Makefile (added BBG obj entry)"
            echo "arch/arm64/configs/alioth_kosminor_defconfig (added BBG LSM config)"
          } > ${{ env.WORK_DIR }}/dist/patches/BBG_INTEGRATION_FILES.txt

          # Export diff of security layer changes
          git diff -- security/Kconfig security/Makefile > ${{ env.WORK_DIR }}/dist/patches/0001-security-bbg-wiring.diff || true
          cp arch/arm64/configs/alioth_kosminor_defconfig ${{ env.WORK_DIR }}/dist/patches/alioth_kosminor_bbg_defconfig.fragment
          cp ${{ env.WORK_DIR }}/build.log ${{ env.WORK_DIR }}/dist/meta/build.log

      - name: Upload Full Build Artifacts (KSU + BBG Kernel)
        uses: actions/upload-artifact@v4
        with:
          name: Alioth_Kernel_KSU_BBG-${{ github.run_number }}
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
            out/arch/arm64/boot/dtbo.img
            ${{ env.WORK_DIR }}/dist/**
          if-no-files-found: error
          retention-days: 14
