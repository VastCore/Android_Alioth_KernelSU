name: Build Alioth Mod(Release)
on: [workflow_dispatch]

jobs:
  build:
    name: Build Alioth Mod(Release)
    runs-on: ubuntu-24.04
    steps:

      - name: Set Beijing timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Shanghai"

      - name: Set SWAP to 5GiB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 5

      - name: Initialize Compilation Environment
        run: |
          sudo apt-get update
          sudo apt-get install git automake build-essential bc -y
          # 全局git配置防128超时
          git config --global http.timeout 300
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: HyperOS
          fetch-depth: 1

      # ========== 安全修改 mkcompile_h 步骤（无语法破坏） ==========
      - name: Safe Custom Compiler String (No Script Break)
        run: |
          # 你要自定义的编译器文字（直接改这里即可）
          CUSTOM_COMPILER='clang version 10.0.7 for Android NDK, GNU ld (binutils-2.27-bd24d23f) 2.27.0.20170315'

          # 1. 把入参 CC_VERSION=$5 强制替换为自定义字符串
          sed -i "s|^CC_VERSION=\$5|CC_VERSION='$CUSTOM_COMPILER'|" scripts/mkcompile_h

          # 2. 注释掉LD_VERSION自动获取行（不删除，保证脚本结构完整）
          sed -i 's/^LD_VERSION=/#LD_VERSION=/' scripts/mkcompile_h

          # 3. 修改打印行，移除 , $LD_VERSION，不再拼接链接器版本
          sed -i 's|printf '\''#define LINUX_COMPILER "%s"\n'\'' "$CC_VERSION, $LD_VERSION"|printf '\''#define LINUX_COMPILER "%s"\n'\'' "$CC_VERSION"|' scripts/mkcompile_h

          # 语法校验，提前发现错误
          bash -n scripts/mkcompile_h
          echo "✅ mkcompile_h 脚本修改完成，语法校验通过"

      - name: Get Toolchain（加ghproxy防git 128报错）
        run: |
          git clone https://mirror.ghproxy.com/https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone.git --depth 1 toolchain/llvm
          git clone https://mirror.ghproxy.com/https://github.com/VastCore/alioth-python-2.7.18-prebuilt.git --depth=1 toolchain/python2
          # 软链接python2防止内核脚本找不到python
          sudo ln -sf $GITHUB_WORKSPACE/toolchain/python2/bin/python2 /usr/local/bin/python

      - name: Processing submodules
        run: |
          git submodule update --init --recursive Baseband-guard
          git submodule update --init --recursive KernelSU
          cd KernelSU
          git fetch --tags
          LATEST_TAG=$(git tag -l | sort -V | tail -n1)
          echo "Latest KernelSU tag: $LATEST_TAG"
          git checkout $LATEST_TAG

      - name: Integrate KernelSU into build system
        run: |
          echo "=== Remove symlink, copy real directory instead ==="
          rm -f drivers/kernelsu
          cp -ra KernelSU/kernel drivers/kernelsu
          echo "=== Verify integration ==="
          test -f drivers/kernelsu/Kconfig && echo "Kconfig: OK"
          test -f drivers/kernelsu/Makefile && echo "Makefile: OK"
          grep -q 'source.*kernelsu/Kconfig' drivers/Kconfig && echo "Kconfig ref: OK"
          grep -q 'obj.*kernelsu/' drivers/Makefile && echo "Makefile ref: OK"
          ls drivers/kernelsu/

      - name: Add KSU configs
        run: |
          sed -i -e '$a\'$'\n''CONFIG_KSU=y\nCONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y' arch/arm64/configs/alioth_kosminor_defconfig
          echo "=== KSU configs appended ==="
          tail -5 arch/arm64/configs/alioth_kosminor_defconfig

      - name: Build Kernel
        run: |
          export LOCALVERSION="-g92c089fc2d37"
          export KBUILD_BUILD_HOST=AICloudServer
          export KBUILD_BUILD_USER=VastCore
          export ARCH="arm64"
          export SUBARCH="arm64"
          export PATH="$GITHUB_WORKSPACE/toolchain/llvm/bin:$GITHUB_WORKSPACE/toolchain/python2/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/llvm/lib64:$GITHUB_WORKSPACE/toolchain/python2/lib:$LD_LIBRARY_PATH"
          # 删掉原来抓取clang/lld的两行export，避免冲突
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-android-"
          make O=out alioth_kosminor_defconfig
          echo "=== CONFIG_KSU in .config ==="
          grep CONFIG_KSU out/.config || echo "WARNING: CONFIG_KSU NOT in .config!"
          make -j$(nproc --all) O=out 2>&1

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alioth_Kernel_Ksu
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
            out/arch/arm64/boot/dtbo.img
 
